# Render Blueprint for the Django backend. In the Render dashboard:
#   New +  ->  Blueprint  ->  pick this repo. It reads this file.
# DATABASE_URL is intentionally not set here (sync: false) — paste your Neon
# Postgres connection string into it in the dashboard after the service is created.
services:
  - type: web
    name: quizapp-backend
    runtime: python
    rootDir: backend
    # Colocate with the Neon DB region — a US backend hitting an EU database
    # adds ~100-150ms to EVERY query, which the 1s poll multiplies badly.
    region: frankfurt
    # Starter never spins down, so no multi-minute cold start on first load.
    plan: starter
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    # Multiple workers + threads so concurrent polls don't queue behind one worker.
    startCommand: "gunicorn core.wsgi:application --workers 2 --threads 4 --timeout 60"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "api.lasvacaciones.nl"
      - key: FRONTEND_ORIGIN
        value: "https://lasvacaciones.nl"
      - key: DATABASE_URL
        sync: false
